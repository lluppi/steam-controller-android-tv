name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the repo. Pinned to commit SHAs rather than movable tags,
# and checkout does not leave its credentials in the workspace.
permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # the default also asks for the long-removed "tools" package, which fails sdkmanager
          packages: platform-tools

      # Versions pinned to what app/build.gradle.kts declares: compileSdk 35, plus the NDK and
      # CMake versions AGP resolves against.
      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses > /dev/null

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
